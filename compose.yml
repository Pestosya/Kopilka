services:
  kopilka:
    image: ghcr.io/pestosya/kopilka:latest
    build: .
    restart: unless-stopped
    ports:
      - "${KOPILKA_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Пока приложение доступно по голому HTTP, Secure-cookie выключены —
      # иначе браузер выбрасывает куку сессии и вход не работает.
      # После настройки HTTPS поставьте COOKIE_SECURE=true в .env рядом с этим файлом.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_PATH: /data/kopilka.sqlite
      SESSION_DAYS: ${SESSION_DAYS:-30}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - kopilka-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      - kopilka
    security_opt:
      - no-new-privileges:true

volumes:
  kopilka-data:
